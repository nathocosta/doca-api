<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada | Doca</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#526069',
                        background: '#f9f9f9',
                        'on-surface-variant': '#43474a',
                    },
                    borderRadius: {
                        'lg': '2rem',
                        'xl': '3rem',
                        'full': '9999px'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        h1, h2 {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="bg-background dark:bg-zinc-950 min-h-screen flex flex-col items-center justify-center p-8 text-center transition-colors duration-300">
    <div class="max-w-md w-full flex flex-col items-center gap-6">
        <!-- Cute Sleeping Doca Mascot -->
        <div class="w-48 h-48 relative flex items-center justify-center">
            <img src="img/dormindo.png" alt="Doca Dormindo" class="w-40 h-40 object-contain animate-bounce" style="animation-duration: 3s;" />
        </div>

        <h1 class="text-7xl font-bold text-primary dark:text-zinc-100">404</h1>
        <h2 class="text-2xl font-bold text-zinc-800 dark:text-zinc-200">Ops! O Doca pegou no sono...</h2>
        <p class="text-on-surface-variant dark:text-zinc-400 text-sm max-w-sm leading-relaxed">
            Não conseguimos encontrar a página que você estava procurando. Talvez ela tenha sido movida ou removida do servidor.
        </p>

        <a href="/" class="mt-4 bg-primary dark:bg-zinc-800 hover:opacity-90 transition-opacity text-white rounded-full px-8 py-3 font-semibold flex items-center gap-2 shadow-md">
            <span class="material-symbols-outlined">home</span>
            Voltar para o Início
        </a>
    </div>
    
    <script>
        // Apply theme from localStorage or system preference
        const storedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
